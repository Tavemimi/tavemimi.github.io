<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- fundo arredondado com o gradiente do site -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#ff5d8f"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- claquete de cinema -->
  <g transform="translate(10 14)">
    <!-- corpo da claquete -->
    <rect x="0" y="14" width="44" height="26" rx="3" fill="#1e1b31"/>
    <!-- tampa/braço de cima -->
    <rect x="-1" y="6" width="46" height="11" rx="2.5" fill="#272343"
          transform="rotate(-8 22 11)"/>
    <!-- listras brancas diagonais da tampa -->
    <g transform="rotate(-8 22 11)" fill="#f3f0ff">
      <polygon points="2,7 9,7 5,16 -2,16"/>
      <polygon points="14,7 21,7 17,16 10,16"/>
      <polygon points="26,7 33,7 29,16 22,16"/>
      <polygon points="38,7 45,7 41,16 34,16"/>
    </g>
  </g>

  <!-- coraçãozinho no corpo da claquete -->
  <path d="M32 36
           c-1.6-2.4-5.2-2-5.2 1
           c0 2.2 3 4.4 5.2 6.2
           c2.2-1.8 5.2-4 5.2-6.2
           c0-3-3.6-3.4-5.2-1 z"
        fill="#ff5d8f"/>
</svg>
