<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#220a14"/>
      <stop offset="0.55" stop-color="#1a0a12"/>
      <stop offset="1" stop-color="#140609"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.15" cy="0" r="0.8">
      <stop offset="0" stop-color="#c0304f" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c0304f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="1" cy="0.05" r="0.85">
      <stop offset="0" stop-color="#e84a6f" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#e84a6f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="0.5" cy="1.1" r="0.7">
      <stop offset="0" stop-color="#ff6b9d" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ff6b9d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titulo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b9d"/>
      <stop offset="0.4" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#a05cff"/>
      <stop offset="1" stop-color="#5c9dff"/>
    </linearGradient>
  </defs>

  <!-- fundo vinho com brilhos -->
  <rect width="1200" height="630" fill="url(#fundo)"/>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>
  <rect width="1200" height="630" fill="url(#g3)"/>

  <!-- coraçõezinhos decorativos -->
  <text x="150" y="150" font-size="54" opacity="0.5">💕</text>
  <text x="1000" y="190" font-size="64" opacity="0.6">❤️</text>
  <text x="980" y="500" font-size="48" opacity="0.45">💖</text>
  <text x="180" y="520" font-size="44" opacity="0.4">✨</text>

  <!-- emoji central -->
  <text x="600" y="230" font-size="120" text-anchor="middle">🎬❤️</text>

  <!-- título com contorno preto -->
  <text x="600" y="360" text-anchor="middle"
        font-family="Poppins, Segoe UI, sans-serif" font-size="88" font-weight="700"
        fill="url(#titulo)" stroke="#000" stroke-width="2" paint-order="stroke">
    Nosso Cantinho
  </text>

  <!-- subtítulo -->
  <text x="600" y="430" text-anchor="middle"
        font-family="Poppins, Segoe UI, sans-serif" font-size="36" font-weight="300"
        fill="#fdeef2">
    de Lembranças
  </text>

  <!-- rodapé com as seções -->
  <text x="600" y="530" text-anchor="middle"
        font-family="Poppins, Segoe UI, sans-serif" font-size="30" font-weight="500"
        fill="#d6a9ba">
    🎬 Filmes   ✍️ Poemas   📸 Fotos
  </text>
</svg>
